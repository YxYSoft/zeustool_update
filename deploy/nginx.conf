# 挂机工具更新日志 · nginx 静态站点配置
#
# 用法：
#   1. 把 index.html / api.html / assets/ / data/ 复制到下面的 root 目录
#   2. 把本文件内容整段放进 nginx 的 http { } 里（或单独 conf.d/site.conf）
#   3. nginx -t && nginx -s reload
#
# 注意：保存为 UTF-8 无 BOM、LF 换行。带 BOM 会让 nginx 报 unknown directive。

server {
    listen       8080;
    server_name  _;

    # 站点目录：Windows 用正斜杠，Linux 用 /var/www/...
    root   D:/web/hangup;
    index  index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    # 不要把 .git / 隐藏文件暴露出去
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 数据文件：每次刷新都要拿到最新的，禁止缓存
    location ~* \.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 样式与脚本：短缓存，改完刷一次就生效
    location ~* \.(css|js)$ {
        expires 1h;
    }

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json;
    gzip_vary         on;
}
