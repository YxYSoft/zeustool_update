<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 参考 · 挂机工具</title>
<meta name="description" content="挂机工具 Lua 接口参考：clua.cpp 注册的全部 mi_* 与键鼠模拟函数。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<header class="site-header api-header">
  <div class="wrap">
    <div class="brand">
      <h1>API 参考</h1>
      <p class="subtitle">clua.cpp 注入的 Lua 接口 · 共 <strong id="api-total">—</strong> 个</p>
    </div>
    <nav class="site-nav" aria-label="站点导航">

<main class="wrap api-layout">

  <aside class="api-side">

    <nav id="api-cats" class="api-cats" aria-label="接口分类"></nav>

    <section id="api-notes" class="api-notes" aria-label="已知问题"></section>

    <section id="api-list" class="api-list" aria-label="接口列表"></section>
  </div>

</main>

<footer class="site-footer">
  <div class="wrap">
    <span>数据源：data/api.json · 内容由 clua.cpp 实际注册表逐条核对</span>
